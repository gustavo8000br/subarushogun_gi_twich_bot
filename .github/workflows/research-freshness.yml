name: Research freshness

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-freshness
  cancel-in-progress: false

jobs:
  freshness:
    name: Research index deadlines
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
      # The CLI is read-only and has no npm dependency (node: built-ins only), so no install step.
      # It exits 1 on OVERDUE or WAIVER-EXPIRED rows and 2 on a format error or en/pt-BR mismatch.
      - name: Check research deadlines and en/pt-BR parity
        run: npm run research:stale -- --strict --check-both
