name: Main CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gates:
    name: CI quality gates
    uses: ./.github/workflows/quality-gates.yml

  publish-image:
    name: Publish Linux multi-platform images to GHCR
    needs: [quality-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.repository }}-main
      cancel-in-progress: false
      queue: max
    outputs:
      stage: ${{ steps.source.outputs.stage }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      image_ref: ${{ steps.manifest.outputs.image_ref }}
    steps:
      - name: Check out trusted main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Materialize source identity for published images
        id: source
        run: |
          node apps/infra/scripts/materialize-version.mjs --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/VERSION"
          PRODUCT_VERSION="$(cat "$RUNNER_TEMP/VERSION")"
          printf 'PRODUCT_VERSION=%s\n' "$PRODUCT_VERSION" >> "$GITHUB_ENV"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'stage=%s\n' "$(tr -d '\r\n' < .release-stage)" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$PRODUCT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish AMD64 image
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg "PRODUCT_VERSION=$PRODUCT_VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-amd64" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:$PRODUCT_VERSION-linux-amd64" \
            --cache-from type=gha,scope=container-linux-amd64 \
            --cache-to type=gha,scope=container-linux-amd64,mode=max \
            --push .
      - name: Build and publish ARM64 image
        run: |
          docker buildx build --platform linux/arm64 \
            --build-arg "PRODUCT_VERSION=$PRODUCT_VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-arm64" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:$PRODUCT_VERSION-linux-arm64" \
            --cache-from type=gha,scope=container-linux-arm64 \
            --cache-to type=gha,scope=container-linux-arm64,mode=max \
            --push .
      - name: Publish and verify versioned multi-platform manifest
        id: manifest
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "ghcr.io/$GITHUB_REPOSITORY:$PRODUCT_VERSION" \
            "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-amd64" \
            "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-arm64"
          manifest="$(docker buildx imagetools inspect --raw "ghcr.io/$GITHUB_REPOSITORY:$PRODUCT_VERSION")"
          jq -e --arg sha "$GITHUB_SHA" '
            .annotations["org.opencontainers.image.revision"] == $sha and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' <<< "$manifest" >/dev/null
          digest="sha256:$(printf '%s' "$manifest" | sha256sum | cut -d ' ' -f 1)"
          printf 'image_ref=%s@%s\n' "$PRODUCT_VERSION" "$digest" >> "$GITHUB_OUTPUT"
      - name: Avoid moving the main manifest backward
        id: source-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "This validated commit was superseded on main; leaving the moving manifest for the newer run."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Promote current architecture images and moving main manifest
        if: steps.source-current.outputs.current == 'true'
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/$GITHUB_REPOSITORY:main-linux-amd64" \
            "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-amd64"
          docker buildx imagetools create \
            --tag "ghcr.io/$GITHUB_REPOSITORY:main-linux-arm64" \
            "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-arm64"
          docker buildx imagetools create \
            --tag "ghcr.io/$GITHUB_REPOSITORY:main" \
            "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-amd64" \
            "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA-linux-arm64"

  beta-windows-installer:
    name: Build immutable beta Windows installer
    needs: [publish-image]
    if: needs.publish-image.outputs.stage == 'beta'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the published source commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.publish-image.outputs.source_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked packager dependencies
        run: npm ci
      - name: Package installer pinned to verified beta image digest
        env:
          BETA_IMAGE_REF: ${{ needs.publish-image.outputs.image_ref }}
          BETA_PRODUCT_VERSION: ${{ needs.publish-image.outputs.version }}
        run: node apps/infra/scripts/package-installer.mjs --platform windows --output "${{ runner.temp }}/queuebot-beta-installer" --image-tag "$env:BETA_IMAGE_REF" --product-version "$env:BETA_PRODUCT_VERSION"
      - name: Launch beta installer directly with isolated fake Docker
        env:
          QUEUEBOT_PREBUILT_INSTALLER: ${{ runner.temp }}/queuebot-beta-installer/subarushogun_twich_bot_setup.bat
          QUEUEBOT_EXPECTED_IMAGE_TAG: ${{ needs.publish-image.outputs.image_ref }}
          QUEUEBOT_EXPECTED_PRODUCT_VERSION: ${{ needs.publish-image.outputs.version }}
        run: node tests/platform/installer-native.mjs
      - name: Upload beta installer for owner QA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: beta-windows-installer-${{ needs.publish-image.outputs.source_sha }}
          path: ${{ runner.temp }}/queuebot-beta-installer/subarushogun_twich_bot_setup.bat
          if-no-files-found: error
          retention-days: 14
