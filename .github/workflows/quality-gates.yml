name: Reusable quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  app-quality:
    name: ${{ matrix.app }} lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [api, infra, web]
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint application
        run: npm run lint:${{ matrix.app }}
      - name: Typecheck application JavaScript
        run: npm run typecheck:${{ matrix.app }}

  lint-tests:
    name: Lint tests and shared project files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint application and tests
        run: npm run lint
      - name: Typecheck application JavaScript
        run: npm run typecheck

  installer-smoke:
    name: Native ${{ matrix.platform }} installer smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            extension: sh
          - platform: macos
            runner: macos-15
            extension: command
          - platform: windows
            runner: windows-latest
            extension: bat
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked packager dependencies
        run: npm ci
      - name: Package one installer file for this operating system
        run: node apps/infra/scripts/package-installer.mjs --platform ${{ matrix.platform }} --output "${{ runner.temp }}/queuebot-installer"
      - name: Launch the installer directly with isolated fake Docker
        env:
          QUEUEBOT_PREBUILT_INSTALLER: ${{ runner.temp }}/queuebot-installer/subarushogun_twich_bot_setup.${{ matrix.extension }}
          QUEUEBOT_EXPECTED_IMAGE_TAG: main
        run: node tests/platform/installer-native.mjs
      - name: Upload Windows installer for owner QA
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.platform == 'windows' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fnd9-windows-installer-${{ github.sha }}
          path: ${{ runner.temp }}/queuebot-installer/subarushogun_twich_bot_setup.bat
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Vitest unit, PostgreSQL, and Compose integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm Docker Compose is available
        run: docker compose version
      - name: Run all tests
        run: npm test

  static-analysis:
    name: Workflow lint, OpenGrep, and version/localization policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Cosign with checksum verification
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
        with:
          cosign-release: 'v2.5.0'
      - name: Install pinned OpenGrep
        env:
          HOME: ${{ runner.temp }}/opengrep-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          test ! -e "$HOME/.opengrep/cli/v1.30.0/opengrep"
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/acf67b45c97c4b63626536605c77064ef536806d/install.sh -o "$RUNNER_TEMP/opengrep-install.sh"
          bash "$RUNNER_TEMP/opengrep-install.sh" -v v1.30.0 --verify-signatures
          echo "$RUNNER_TEMP/opengrep-home/.opengrep/cli/v1.30.0" >> "$GITHUB_PATH"
      - name: Install pinned actionlint with checksum verification
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint -shellcheck= -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Scan application source
        run: npm run review:static
      - name: Validate product version identity
        run: npm run validate:version
      - name: Validate localization catalogs
        run: npm run validate:localization

  container-build:
    name: Compose configuration and production image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Materialize source identity for this image build
        run: |
          node apps/infra/scripts/materialize-version.mjs --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/VERSION"
          PRODUCT_VERSION="$(cat "$RUNNER_TEMP/VERSION")"
          printf 'PRODUCT_VERSION=%s\n' "$PRODUCT_VERSION" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application image
        run: docker compose build bot
      - name: Verify materialized version inside image
        run: |
          IMAGE_VERSION="$(docker compose run --rm --no-deps --entrypoint cat bot /app/VERSION)"
          test "$IMAGE_VERSION" = "$PRODUCT_VERSION"

  quality-gate:
    name: Required quality gate
    if: ${{ always() }}
    needs: [app-quality, lint-tests, installer-smoke, tests, static-analysis, container-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every quality job to succeed
        env:
          APP_QUALITY: ${{ needs.app-quality.result }}
          LINT_TESTS: ${{ needs.lint-tests.result }}
          INSTALLER_SMOKE: ${{ needs['installer-smoke'].result }}
          TESTS: ${{ needs.tests.result }}
          STATIC_ANALYSIS: ${{ needs['static-analysis'].result }}
          CONTAINER_BUILD: ${{ needs['container-build'].result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$APP_QUALITY" "$LINT_TESTS" "$INSTALLER_SMOKE" "$TESTS" "$STATIC_ANALYSIS" "$CONTAINER_BUILD"; do
            if [[ "$result" != "success" ]]; then
              echo "A required quality job did not succeed: $result" >&2
              exit 1
            fi
          done
