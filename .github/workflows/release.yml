name: Publish GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-release:
    name: Resolve the version and validate main
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.actor == 'gustavo8000br' && github.triggering_actor == 'gustavo8000br')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      should_release: ${{ steps.source.outputs.should_release }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve release identity and verify main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          base_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          stage="$(tr -d '\r\n' < .release-stage)"
          short_sha="${source_sha:0:7}"
          if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ! "$stage" =~ ^(alpha|beta|rc|stable)$ || ! "$short_sha" =~ ^[0-9a-f]{7}$ ]]; then
            echo "Main contains an invalid release version, stage, or source SHA." >&2
            exit 1
          fi
          release_tag="v${base_version}-${short_sha}-${stage}"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$stage" != "rc" && "$stage" != "stable" ]]; then
            echo "Automatic prereleases are limited to rc and stable stages; $stage remains owner-triggered."
            printf 'should_release=false\n' >> "$GITHUB_OUTPUT"
            printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
            printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "Only commits already present on main can be released." >&2
            exit 1
          fi
          for attempt in {1..150}; do
            ci_run="$(gh run list --workflow main-cd.yml --commit "$source_sha" --limit 1 --json status,conclusion)"
            ci_status="$(jq -r '.[0].status // ""' <<< "$ci_run")"
            ci_conclusion="$(jq -r '.[0].conclusion // ""' <<< "$ci_run")"
            if [[ "$ci_status" == "completed" ]]; then
              if [[ "$ci_conclusion" != "success" ]]; then
                echo "Main CD for the exact source commit did not succeed." >&2
                exit 1
              fi
              break
            fi
            if [[ "$attempt" == 150 ]]; then
              echo "Timed out waiting for Main CD on the exact source commit." >&2
              exit 1
            fi
            sleep 30
          done
          printf 'should_release=true\n' >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  verify-public-image:
    name: Verify anonymous pull from GHCR
    needs: [prepare-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Pull the release image without registry credentials
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}' | grep -Fx 'linux/amd64'

  resolve-release-image:
    name: Verify and pin the release image
    needs: [prepare-release, verify-public-image]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      source_sha: ${{ needs.prepare-release.outputs.source_sha }}
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
    steps:
      - name: Set up Buildx for registry manifest inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve and verify the exact public release image digest
        id: resolve
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-manifest.json"
          docker buildx imagetools inspect --raw "ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG" > "$manifest"
          jq -e --arg sha "$SOURCE_SHA" '
            .annotations["org.opencontainers.image.revision"] == $sha and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' "$manifest" >/dev/null
          digest="sha256:$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          printf 'image_ref=%s@%s\n' "$RELEASE_TAG" "$digest" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build ${{ matrix.platform }} installer
    needs: [prepare-release, resolve-release-image]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            extension: sh
          - platform: macos
            runner: macos-15
            extension: command
          - platform: windows
            runner: windows-latest
            extension: bat
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve-release-image.outputs.source_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked packager dependencies
        run: npm ci
      - name: Package one installer for this operating system
        env:
          RELEASE_IMAGE_REF: ${{ needs.resolve-release-image.outputs.image_ref }}
        run: node apps/infra/scripts/package-installer.mjs --platform ${{ matrix.platform }} --output "${{ runner.temp }}/queuebot-installer" --image-tag "$RELEASE_IMAGE_REF"
      - name: Launch installer with isolated fake Docker
        env:
          QUEUEBOT_PREBUILT_INSTALLER: ${{ runner.temp }}/queuebot-installer/subarushogun_twich_bot_setup.${{ matrix.extension }}
          QUEUEBOT_EXPECTED_IMAGE_TAG: ${{ needs.resolve-release-image.outputs.image_ref }}
        run: node tests/platform/installer-native.mjs
      - name: Upload tested installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-installer-${{ matrix.platform }}
          path: ${{ runner.temp }}/queuebot-installer/subarushogun_twich_bot_setup.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-release:
    name: Publish versioned release
    needs: [prepare-release, resolve-release-image, build-installers]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Verify tag matches the source commit and release configuration
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve-release-image.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          stage="$(tr -d '\r\n' < .release-stage)"
          short_sha="${SOURCE_SHA:0:7}"
          expected="v${base_version}-${short_sha}-${stage}"
          if [[ ! "$short_sha" =~ ^[0-9a-f]{7}$ || "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag does not match package version, source commit, and release stage." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Only commits already present on main can be released." >&2
            exit 1
          fi
          ci_run="$(gh run list --workflow main-cd.yml --commit "$SOURCE_SHA" --limit 1 --json status,conclusion)"
          ci_status="$(jq -r '.[0].status // ""' <<< "$ci_run")"
          ci_conclusion="$(jq -r '.[0].conclusion // ""' <<< "$ci_run")"
          if [[ "$ci_status" != "completed" || "$ci_conclusion" != "success" ]]; then
            echo "The latest CI run for this source commit must complete successfully before release." >&2
            exit 1
          fi
      - name: Download tested platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-installer-*
          path: release-assets
          merge-multiple: true
      - name: Check exactly one installer for each supported desktop OS
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            release-assets/subarushogun_twich_bot_setup.bat
            release-assets/subarushogun_twich_bot_setup.command
            release-assets/subarushogun_twich_bot_setup.sh
          )
          for asset in "${expected_assets[@]}"; do
            test -f "$asset"
          done
          asset_count="$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$asset_count" != "3" ]]; then
            echo "Expected exactly three installer assets, one per supported desktop OS." >&2
            exit 1
          fi
      - name: Create bilingual release notes from public changelogs
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: node apps/infra/scripts/create-release-notes.mjs --version "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Create the version tag from the verified main commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "The release source is no longer on main." >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            existing_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [[ "$existing_sha" != "$SOURCE_SHA" ]]; then
              echo "The release tag already exists and points to a different commit." >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish release with the three installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          stage="${RELEASE_TAG##*-}"
          release_args=("$RELEASE_TAG" release-assets/* --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          gh release create "${release_args[@]}" --prerelease
