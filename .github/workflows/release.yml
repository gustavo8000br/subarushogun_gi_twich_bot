name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (must point to a commit already on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve-release-image:
    name: Verify and pin the release image
    if: ${{ github.actor == 'gustavo8000br' && github.triggering_actor == 'gustavo8000br' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_tag }}
      - name: Resolve release source commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9a-f]{7}-(alpha|beta|rc|stable)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH-seven-hex-STAGE." >&2
            exit 1
          fi
          source_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx for registry manifest inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Resolve and verify the exact release image digest
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-manifest.json"
          docker buildx imagetools inspect --raw "ghcr.io/$GITHUB_REPOSITORY:$RELEASE_TAG" > "$manifest"
          jq -e --arg sha "$SOURCE_SHA" '
            .annotations["org.opencontainers.image.revision"] == $sha and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' "$manifest" >/dev/null
          digest="sha256:$(sha256sum "$manifest" | cut -d ' ' -f 1)"
          printf 'image_ref=%s@%s\n' "$RELEASE_TAG" "$digest" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build ${{ matrix.platform }} installer
    needs: resolve-release-image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            extension: sh
          - platform: macos
            runner: macos-15
            extension: command
          - platform: windows
            runner: windows-latest
            extension: bat
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install locked packager dependencies
        run: npm ci
      - name: Package one installer for this operating system
        env:
          RELEASE_IMAGE_REF: ${{ needs.resolve-release-image.outputs.image_ref }}
        run: node apps/infra/scripts/package-installer.mjs --platform ${{ matrix.platform }} --output "${{ runner.temp }}/queuebot-installer" --image-tag "$RELEASE_IMAGE_REF"
      - name: Launch installer with isolated fake Docker
        env:
          QUEUEBOT_PREBUILT_INSTALLER: ${{ runner.temp }}/queuebot-installer/subarushogun_twich_bot_setup.${{ matrix.extension }}
          QUEUEBOT_EXPECTED_IMAGE_TAG: ${{ needs.resolve-release-image.outputs.image_ref }}
        run: node tests/platform/installer-native.mjs
      - name: Upload tested installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-installer-${{ matrix.platform }}
          path: ${{ runner.temp }}/queuebot-installer/subarushogun_twich_bot_setup.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-release:
    name: Publish versioned release
    needs: [resolve-release-image, build-installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
      - name: Verify tag matches the source commit and release configuration
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve-release-image.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          stage="$(tr -d '\r\n' < .release-stage)"
          short_sha="${SOURCE_SHA:0:7}"
          expected="v${base_version}-${short_sha}-${stage}"
          if [[ ! "$short_sha" =~ ^[0-9a-f]{7}$ || "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag does not match package version, source commit, and release stage." >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$SOURCE_SHA" ]]; then
            echo "Release tag does not point to the checked-out source commit." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Only commits already present on main can be released." >&2
            exit 1
          fi
          ci_run="$(gh run list --workflow main-cd.yml --commit "$SOURCE_SHA" --limit 1 --json status,conclusion)"
          ci_status="$(jq -r '.[0].status // ""' <<< "$ci_run")"
          ci_conclusion="$(jq -r '.[0].conclusion // ""' <<< "$ci_run")"
          if [[ "$ci_status" != "completed" || "$ci_conclusion" != "success" ]]; then
            echo "The latest CI run for this source commit must complete successfully before release." >&2
            exit 1
          fi
      - name: Download tested platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-installer-*
          path: release-assets
          merge-multiple: true
      - name: Check exactly one installer for each supported desktop OS
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            release-assets/subarushogun_twich_bot_setup.bat
            release-assets/subarushogun_twich_bot_setup.command
            release-assets/subarushogun_twich_bot_setup.sh
          )
          for asset in "${expected_assets[@]}"; do
            test -f "$asset"
          done
          asset_count="$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [[ "$asset_count" != "3" ]]; then
            echo "Expected exactly three installer assets, one per supported desktop OS." >&2
            exit 1
          fi
      - name: Create bilingual release notes from public changelogs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node apps/infra/scripts/create-release-notes.mjs --version "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish release with the three installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          stage="${RELEASE_TAG##*-}"
          release_args=("$RELEASE_TAG" release-assets/* --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          gh release create "${release_args[@]}" --prerelease
