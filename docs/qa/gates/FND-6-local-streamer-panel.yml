    notes: 'PostgreSQL and recovery flows pass local tests/runtime checks. Eligible-channel remote writes, chat sends and EventSub recovery remain untested because the connected channel is ineligible.'
  maintainability:
    status: PASS
    notes: 'ESM/JSDoc modular structure, bilingual docs and 384 passing tests; no blocking review issue.'
