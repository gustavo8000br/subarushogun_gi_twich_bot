story: FND-6
story_title: Local streamer panel, protected API, and operator experience
gate: CONCERNS
status_reason: >-
  All 17 acceptance criteria have automated or local operational evidence, all 384 tests and
  project quality gates pass, and no blocking code issue was found. The authorized Twitch
  account is ineligible, so reward writes, redemptions, chat delivery, and EventSub recovery
  could not be validated against an eligible live channel.
