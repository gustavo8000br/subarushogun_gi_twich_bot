storyId: FND-7
createdAt: '2026-10-05T17:00:00Z'
createdBy: '@architect (AIOX implementation-plan phase)'
status: pending
complexity: COMPLEX
estimatedEffort: Multiple reviewable increments; calendar estimate deferred until
  upstream service readiness is mapped.
dependencies:
- name: OBS Studio Browser Source
  version: Current supported release
  purpose: Render a local URL; manual verification is required.
- name: FND-2
  version: Current story
  purpose: Queue domain and safe viewer identity.
- name: FND-5
  version: Open issue
  purpose: Current account, called viewer, and in-service state.
- name: FND-6
  version: Open issue
  purpose: Protected panel, session, and local HTTP security.
phases:
- id: phase-0
  name: Readiness and UX approval gates
  description: No schema, backend, or UI implementation begins until upstream readiness
    and UX decisions are documented.
  subtasks:
  - id: '0.1'
    service: planning
    files:
    - docs/stories/FND-7/validation.md
    description: Verify FND-5 and FND-6 are fully complete and map every required
      atomic field to delivered application projections and protected panel/security
      services; block FND-7 if any prerequisite is incomplete.
    verification:
      type: manual
      instructions: Record upstream story statuses, source service/API for all seven
        dynamic fields, panel/session/CSRF/Host-Origin primitives, and an explicit
        all-fields-ready decision. No reduced field subset.
    status: pending
    dependencies: []
  - id: '0.2'
    description: Complete UX review and record accepted font labels, default style,
      preview, empty/stale/unavailable states, accessible labels/focus, and consistency
      with existing panel before any UI coding.
    service: frontend
    files:
    - docs/stories/FND-7/ux-refinement.md
    verification:
      type: manual
      instructions: '@aiox-ux-design-expert approves the journey, loading/error/empty/revocation
        states, keyboard access, labels, visible focus and readability preview.'
    status: pending
    dependencies: []
  - id: '0.3'
    service: backend
    files:
    - docs/stories/FND-7/validation.md
    description: Write and validate shared Unicode code-point counting examples for
      240-character fixed and fallback text.
    verification:
      type: manual
      instructions: Document same code-point rule for browser and server and boundary
        examples at 240 and 241.
    status: pending
    dependencies: []
- id: phase-1
  name: Widget persistence foundation
  description: Test and add durable widget configuration and capability hash after
    all phase-0 gates pass.
  subtasks:
  - id: '1.1'
    description: Write real PostgreSQL migration-contract tests for widget create/edit/delete,
      capability hashing, widget scope, rotation, revocation, and restart durability.
    service: database
    files:
    - tests/integration/overlay-widget-repository.test.js
    verification:
      type: command
      command: npm test -- --run tests/integration/overlay-widget-repository.test.js
    status: pending
    dependencies:
    - '0.1'
    notes: Observe behavioral Red before changing Prisma or SQL.
  - id: '1.2'
    description: Add the Prisma widget model and SQL migration after the database
      tests fail for the missing behavior.
    service: database
    files:
    - apps/api/prisma/schema.prisma
    - apps/api/prisma/migrations/<timestamp>_overlay_widgets/migration.sql
    verification:
      type: command
      command: npm test -- --run tests/integration/overlay-widget-repository.test.js
    status: pending
    dependencies:
    - '0.1'
    - '1.1'
    notes: Persist only a cryptographic hash of each capability.
- id: phase-2
  name: Core field and capability policy
  description: Implement allowlisted data fields, styling validation, and capability
    lifecycle.
  subtasks:
  - id: '2.1'
    description: Write unit tests for field scope, queue selection, fallback states,
      240-character Unicode counting, style allowlists, and malicious input.
    service: backend
    files:
    - tests/unit/overlay-fields.test.js
    - tests/unit/overlay-style.test.js
    verification:
      type: command
      command: npm test -- --run tests/unit/overlay-fields.test.js tests/unit/overlay-style.test.js
    status: pending
    dependencies:
    - '0.1'
    - '0.2'
    - '0.3'
    - '1.2'
  - id: '2.2'
    description: Implement pure overlay field and style validation after observing
      behavioral Red.
    service: backend
    files:
    - apps/api/src/domain/overlay-widget.mjs
    - apps/api/src/domain/overlay-style.mjs
    verification:
      type: command
      command: npm test -- --run tests/unit/overlay-fields.test.js tests/unit/overlay-style.test.js
    status: pending
    dependencies:
    - '2.1'
    - '0.1'
  - id: '2.3'
    service: backend
    files:
    - tests/unit/overlay-capability.test.js
    verification:
      type: command
      command: npm test -- --run tests/unit/overlay-capability.test.js
    description: Write token lifecycle unit tests for random generation, hash-only
      persistence boundary, one-widget scope, and rotation/revocation.
    status: pending
    dependencies:
    - '0.1'
    - '0.2'
    - '0.3'
    - '1.2'
  - id: '2.4'
    description: Implement capability issue/verify/revoke policy and retest after
      Refactor.
    service: backend
    files:
    - apps/api/src/domain/overlay-capability.mjs
    verification:
      type: command
      command: npm test -- --run tests/unit/overlay-capability.test.js
    status: pending
    dependencies:
    - '2.3'
    - '0.1'
- id: phase-2b
  name: Widget repository and application service
  description: Implement durable widget CRUD and capability lifecycle through a service
    after repository contract tests pass.
  subtasks:
  - id: 2b.1
    service: backend
    description: Write real PostgreSQL/application service tests for create/edit/delete,
      token issue/hash verification, one-time URL, rotate/revoke, and concurrent delete/read
      atomicity.
    files:
    - tests/integration/overlay-widget-service.test.js
    verification:
      type: command
      command: npm test -- --run tests/integration/overlay-widget-service.test.js
    status: pending
    dependencies:
    - '0.1'
    - '1.2'
    - '2.4'
    notes: Deletion and capability invalidation must commit atomically; no success
      response while old token remains valid.
  - id: 2b.2
    service: backend
    description: Implement repository plus application service for widget persistence
      and capability lifecycle after observing Red.
    files:
    - apps/api/src/persistence/overlay-widget-repository.mjs
    - apps/api/src/domain/overlay-widget-service.mjs
    verification:
      type: command
      command: npm test -- --run tests/integration/overlay-widget-service.test.js
    status: pending
    dependencies:
    - '0.1'
    - 2b.1
    notes: Persist only hashes; URL secret is returned only from create/regenerate
      mutation response.
- id: phase-3
  name: HTTP management and scoped read routes
  description: Connect protected panel operations and isolated read-only OBS access.
  subtasks:
  - id: '3.1'
    description: Write HTTP contract tests for management session/CSRF, Host/Origin,
      token scope, rejected/revoked capabilities, exact data projection, cache/referrer
      headers, and absence of mutations.
    service: backend
    files:
    - tests/integration/overlay-routes.test.js
    verification:
      type: command
      command: npm test -- --run tests/integration/overlay-routes.test.js
    status: pending
    dependencies:
    - '0.1'
    - '2.2'
    - '2.4'
    - 2b.2
  - id: '3.2'
    description: Implement widget management and token-only read routes through shared
      application/domain projections.
    service: backend
    files:
    - apps/api/src/http/overlay-routes.mjs
    - apps/api/src/server.mjs
    verification:
      type: command
      command: npm test -- --run tests/integration/overlay-routes.test.js
    status: pending
    dependencies:
    - '0.1'
    - '3.1'
    notes: Match actual route registration path during implementation; never query
      Prisma entities directly from the route.
- id: phase-4
  name: Browser Source renderer
  description: Build safe transparent renderer with update, empty, stale, recovery,
    and revoke states.
  subtasks:
  - id: '4.1'
    description: Write browser tests for safe text, transparent page, selected style,
      two-second update, empty fallback, transient stale marker, recovery, and 401/403
      clearing. Run eight concurrently open widgets on mixed dynamic fields; measure
      committed-change-to-rendered-DOM over 10 consecutive changes, each <=2s, and
      record environment.
    service: frontend
    files:
    - tests/e2e/overlay-browser.test.js
    verification:
      type: e2e
      testFile: tests/e2e/overlay-browser.test.js
      instructions: Run against the app and isolated migrated PostgreSQL.
    status: pending
    dependencies:
    - '3.2'
    - '0.1'
    - '0.2'
  - id: '4.2'
    description: Implement the single-widget local renderer and no-faster-than-needed
      polling using local assets only.
    service: frontend
    files:
    - apps/web/overlay.html
    - apps/web/overlay.js
    - apps/web/overlay.css
    verification:
      type: command
      command: npm test -- --run tests/e2e/overlay-browser.test.js
    status: pending
    dependencies:
    - '4.1'
    - '0.1'
    - '0.2'
- id: phase-5
  name: Panel controls and integration
  description: Refine the UX and add widget source, style, preview, and link lifecycle
