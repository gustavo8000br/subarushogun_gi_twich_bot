story: OPS-3
story_title: Catálogo de comandos e permissões por cargo
gate: PASS
status_reason: >-
  O QA independente encontrou e reproduziu incompatibilidade de alta severidade entre o contrato
  de badges em mapa de objetos do Twurple e a autorização que aceitava somente arrays. A correção
  test-first aceita os dois formatos e passa na cobertura ponta a ponta de EventSub até autorização.
  O catálogo inteiro foi revisado no Chrome sem alterar políticas salvas. Gates locais passam.
  Não foram executadas mutações de chat em live.
reviewer: Quinn (Arquiteto de Testes Independente)
