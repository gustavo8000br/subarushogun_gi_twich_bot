status_reason: 'As rotas vinculam desafios de preview à sessão local ativa, ao canal e à fila, exigem fila ativa e retornam diagnóstico 503 genérico sanitizado com referência/header seguros para falhas inesperadas do serviço. O cliente valida as projeções de preview e confirmação, incluindo empty após challenge consumido. Resultados ambíguos da confirmação fecham o challenge antigo e reconciliam a projeção da fila; se a reconciliação falhar, a UI mostra ação localizada de atualização e bloqueia novos previews/confirmações até uma atualização bem-sucedida. A redação do inventário bilíngue corresponde a esses contratos. Este PASS é limitado a QRA-14/15; OPS-15 permanece In Progress e o gate final da story não foi satisfeito.'
