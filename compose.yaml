name: subarushogun-gi-twitch-queue-bot

services:
  bootstrap:
    image: node:24.20.0-bookworm-slim
    user: "0:0"
    working_dir: /workspace
    volumes:
      - ./package.json:/workspace/package.json:ro
      - ./apps/infra/src/bootstrap-secret.mjs:/workspace/apps/infra/src/bootstrap-secret.mjs:ro
      - ./apps/infra/scripts/bootstrap.mjs:/workspace/apps/infra/scripts/bootstrap.mjs:ro
      - operational_secrets:/var/lib/aiox/secrets
    command: ["node", "apps/infra/scripts/bootstrap.mjs"]
    restart: "no"

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: queuebot
      POSTGRES_DB: queuebot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - operational_secrets:/run/secrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuebot -d queuebot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    image: subarushogun/gi-twitch-queue-bot:v0.1.0-0000000-alpha
    build: .
    user: "10001:10001"
    group_add:
      - "999"
    command: ["node", "apps/infra/scripts/migrate.mjs"]
    volumes:
      - operational_secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  bot:
    image: subarushogun/gi-twitch-queue-bot:v0.1.0-0000000-alpha
    build: .
    user: "10001:10001"
    group_add:
      - "999"
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-3000}
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-3000}
      CALLBACK_URL: http://localhost:${APP_PORT:-3000}/callback
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - operational_secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/infra/scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    stop_grace_period: 30s

volumes:
  postgres_data:
  operational_secrets:
